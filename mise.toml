# Tool pins for this repository (core ADR-0043, Snowcat ADR-0076).
# Go comes from go.mod — never pin it here. Every tool the gates invoke
# beyond the worker base image is listed; mise.lock carries the checksums.
[settings]
idiomatic_version_file_enable_tools = ["go"]
lockfile = true

[tools]
golangci-lint = "2.15.0"
# svu reads .svu.yml only from v3 on; `make bump` refuses any other release.
svu = "3.4.1"
# The Rust crate frostyard-problems (rust/, ADR-0003): cargo fmt, clippy and
# test, and a check build for the Windows and macOS targets (no-op stubs).
rust = { version = "1.99.1", components = "clippy,rustfmt", targets = "x86_64-pc-windows-gnu,x86_64-apple-darwin" }
