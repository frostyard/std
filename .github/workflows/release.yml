# .github/workflows/release.yml
#
# std is a library: a release is the tag `make bump` pushes plus a
# changelog-only GitHub release. GoReleaser skips builds (.goreleaser.yaml)
# and publishes nothing else. Actions are pinned by commit SHA
# (frostyard/core ADR-0021); this file is a review-required high-risk
# boundary in policies/agent-governance.json.
name: goreleaser

on:
  push:
    # run only against tags
    tags:
      - "*"

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          # 'goreleaser-pro' because .goreleaser.yaml sets `pro: true`
          distribution: goreleaser-pro
          # 'latest', 'nightly', or a semver
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # GoReleaser Pro key — an org-level secret
          GORELEASER_KEY: ${{ secrets.GORELEASER_KEY }}
