name: CI

# The PR gate: the Go half mirrors `make check` (fmt, lint, test) plus the
# race detector, a tidy/vet/gofmt verify job, a cross-architecture build of
# every _examples/ program (frostyard/core ADR-0038 — this is the hosted half
# of what `make ci` mirrors), and a govulncheck security scan (pinned v1.7.0
# — std is dependency-free, so this is the reachable standard-library
# advisory signal every consumer inherits); docs-gate is the docs-integrity
# check from ADR-0001. Actions are pinned by commit SHA with least-privilege
# permissions (frostyard/core ADR-0021).
#
# The same jobs also run on the merge queue's temporary branches
# (frostyard/core ADR-0042), so every required check reports there. No job
# is excluded by a job-level `if:` — an excluded required job never reports
# and stalls the queue until the check timeout expires.

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:

permissions: {}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # mise.toml and mise.lock are the single source of every tool pin
      # (core ADR-0043): this installs exactly the locked golangci-lint,
      # checksum-verified, the same way a developer's `mise install` and a
      # Snowcat worker's target preparation do, so the three cannot drift.
      # Go still comes from actions/setup-go above (go.mod's toolchain line).
      - name: Install pinned tools
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install: true
          install_args: golangci-lint
          cache: true

      # Same config and pin guard `make lint`/`make verify` use.
      - name: golangci-lint
        run: |
          make lint-version-check
          golangci-lint run

      # The step above lints the packages `./...` matches, which never
      # includes _examples/: Go package patterns ignore directories starting
      # with "_". Name those package directories explicitly, using the same
      # enumeration `make lint` uses so a new _examples/<program>/ is covered
      # without editing this workflow.
      - name: golangci-lint on the _examples programs
        run: |
          dirs="$(./scripts/example-dirs.sh)"
          golangci-lint run $dirs

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # Pinned release, as in clix and updex: the scanner cannot change the
      # gate without a commit. Dependency-free module, so the signal is
      # reachable Go standard-library advisories.
      - name: Install pinned govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.7.0

      - name: Run govulncheck
        run: govulncheck ./...

      - name: Run govulncheck over the _examples programs
        run: |
          dirs="$(./scripts/example-dirs.sh)"
          govulncheck $dirs

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # Unit tests plus tests/e2e. The profile and floor below cover reporter
      # code executed in the go test processes. The e2e harness separately
      # builds coverage-instrumented _examples/ binaries, gives every
      # subprocess a project-local GOCOVERDIR, and fails unless their covdata
      # reports covered reporter statements.
      - name: Run tests with coverage
        run: go test -v -coverprofile=coverage.out -covermode=atomic -coverpkg=github.com/frostyard/std/reporter ./...

      # The floor cannot be lowered without a commit: scripts/check-coverage.sh
      # defaults to 95.0 and the self-test pins the script's own behaviour, so
      # a broken checker cannot silently pass a regression.
      - name: Self-test the coverage floor script
        run: make test-coverage-check

      - name: Enforce coverage floor
        run: make coverage-check

      - name: Upload coverage profile
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-profile
          path: coverage.out
          if-no-files-found: error

  race:
    name: Race Detection
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Run tests with race detector
        run: go test -race -short ./...

  examples-build:
    name: Examples Cross-Arch Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # `go build ./...` never reaches _examples/ (package patterns ignore a
      # leading "_"), and building only for the runner's own GOOS/GOARCH
      # would miss a program that only fails to cross-compile. Enumerate the
      # package directories with the same script the Lint and Verify jobs
      # use, and build each for every target `make ci` builds locally, so the
      # two cannot drift (frostyard/core ADR-0038). An empty enumeration
      # fails the script, and so this job, rather than silently building
      # nothing.
      - name: Cross-compile the _examples programs for linux/amd64 and linux/arm64
        run: |
          dirs="$(./scripts/example-dirs.sh)"
          for dir in $dirs; do
            for goos_goarch in linux/amd64 linux/arm64; do
              goos="${goos_goarch%/*}"
              goarch="${goos_goarch#*/}"
              echo "GOOS=$goos GOARCH=$goarch go build $dir"
              GOOS=$goos GOARCH=$goarch go build -o /dev/null "$dir"
            done
          done

  verify:
    name: Verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # std is stdlib-only: there is no go.sum, and a tidy diff (or a new
      # go.sum) here almost always means a dependency crept in.
      - name: Verify go.mod is tidy and dependency-free
        run: |
          go mod tidy
          git diff --exit-code -- go.mod
          test ! -e go.sum

      - name: Run go vet
        run: go vet ./...

      # `./...` above skips _examples/ — Go package patterns ignore
      # directories starting with "_" — so the example programs need their
      # package directories named explicitly. The list is enumerated at run
      # time (and the script fails when it is empty), so a new
      # _examples/<program>/ is vetted without editing this workflow.
      - name: Run go vet over the _examples programs
        run: |
          dirs="$(./scripts/example-dirs.sh)"
          go vet $dirs

      - name: Check formatting
        run: |
          gofmt -l .
          test -z "$(gofmt -l .)"

  docs-gate:
    name: Docs integrity
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Check docs index, links, and conformance aliases
        run: node scripts/check-docs.mjs

  release-config:
    name: Release config
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # The `secrets` context is not available in a step-level `if:` — only
    # `env` is — so the key is mapped to a job-level env var and the guards
    # below test that instead. Using `secrets.*` in `if:` is what made this
    # workflow file invalid.
    env:
      GORELEASER_KEY: ${{ secrets.GORELEASER_KEY }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # `goreleaser check` validates .goreleaser.yaml so a broken release
      # config fails here instead of after an immutable tag is pushed and
      # release.yml is the first thing to read it. Same action SHA and
      # distribution as release.yml: 'goreleaser-pro' because .goreleaser.yaml
      # sets `pro: true`, which OSS GoReleaser refuses to validate.
      - name: Validate .goreleaser.yaml
        if: env.GORELEASER_KEY != ''
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser-pro
          version: "~> v2"
          args: check

      - name: Skip goreleaser check (missing GORELEASER_KEY)
        if: env.GORELEASER_KEY == ''
        run: echo "GORELEASER_KEY unavailable for this run; skipping goreleaser check."
