name: CI

# The PR gate: the Go half mirrors `make check` (fmt, lint, test) plus the
# race detector, a tidy/vet/gofmt verify job, and a govulncheck security
# scan (pinned v1.6.0 — std is dependency-free, so this is the reachable
# standard-library advisory signal every consumer inherits); docs-gate is the
# docs-integrity check from ADR-0001. Actions are pinned by commit SHA with
# least-privilege permissions (frostyard/core ADR-0021).

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: {}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # The Makefile is the single source of truth for the pinned
      # golangci-lint release (GOLANGCI_LINT_VERSION); `make lint` warns on a
      # different local version, so lint results are reproducible between the
      # two and a linter release cannot change the gate without a commit.
      - name: Read pinned golangci-lint version
        id: lint-version
        run: |
          version="$(sed -nE 's/^GOLANGCI_LINT_VERSION[[:space:]]*:?=[[:space:]]*//p' Makefile | tr -d '\r')"
          version="${version%%[[:space:]]*}"
          test -n "$version"
          printf 'version=v%s\n' "$version" >> "$GITHUB_OUTPUT"

      # Same config `make lint` uses (.golangci.yml).
      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: ${{ steps.lint-version.outputs.version }}

      # The step above lints the packages `./...` matches, which never
      # includes _examples/: Go package patterns ignore directories starting
      # with "_". Name those package directories explicitly, using the same
      # enumeration `make lint` uses so a new _examples/<program>/ is covered
      # without editing this workflow. The action installs the pinned release
      # and puts it on PATH, so this runs the same binary and .golangci.yml.
      - name: golangci-lint on the _examples programs
        run: |
          dirs="$(./scripts/example-dirs.sh)"
          golangci-lint run $dirs

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # Pinned release, as in clix and updex: the scanner cannot change the
      # gate without a commit. Dependency-free module, so the signal is
      # reachable Go standard-library advisories.
      - name: Install pinned govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.7.0

      - name: Run govulncheck
        run: govulncheck ./...

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # Unit tests plus tests/e2e, which builds and runs the _examples/
      # programs. -coverpkg attributes coverage to the reporter package no
      # matter which test package exercised it, so the e2e suite's runs of
      # the example programs count toward the floor below.
      - name: Run tests with coverage
        run: go test -v -coverprofile=coverage.out -covermode=atomic -coverpkg=github.com/frostyard/std/reporter ./...

      # The floor cannot be lowered without a commit: scripts/check-coverage.sh
      # defaults to 95.0 and the self-test pins the script's own behaviour, so
      # a broken checker cannot silently pass a regression.
      - name: Self-test the coverage floor script
        run: make test-coverage-check

      - name: Enforce coverage floor
        run: make coverage-check

      - name: Upload coverage profile
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-profile
          path: coverage.out
          if-no-files-found: error

  race:
    name: Race Detection
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Run tests with race detector
        run: go test -race -short ./...

  verify:
    name: Verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # std is stdlib-only: there is no go.sum, and a tidy diff (or a new
      # go.sum) here almost always means a dependency crept in.
      - name: Verify go.mod is tidy and dependency-free
        run: |
          go mod tidy
          git diff --exit-code -- go.mod
          test ! -e go.sum

      - name: Run go vet
        run: go vet ./...

      # `./...` above skips _examples/ — Go package patterns ignore
      # directories starting with "_" — so the example programs need their
      # package directories named explicitly. The list is enumerated at run
      # time (and the script fails when it is empty), so a new
      # _examples/<program>/ is vetted without editing this workflow.
      - name: Run go vet over the _examples programs
        run: |
          dirs="$(./scripts/example-dirs.sh)"
          go vet $dirs

      - name: Check formatting
        run: |
          gofmt -l .
          test -z "$(gofmt -l .)"

  docs-gate:
    name: Docs integrity
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check docs index, links, and conformance aliases
        run: node scripts/check-docs.mjs

  release-config:
    name: Release config
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # The `secrets` context is not available in a step-level `if:` — only
    # `env` is — so the key is mapped to a job-level env var and the guards
    # below test that instead. Using `secrets.*` in `if:` is what made this
    # workflow file invalid.
    env:
      GORELEASER_KEY: ${{ secrets.GORELEASER_KEY }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # `goreleaser check` validates .goreleaser.yaml so a broken release
      # config fails here instead of after an immutable tag is pushed and
      # release.yml is the first thing to read it. Same action SHA and
      # distribution as release.yml: 'goreleaser-pro' because .goreleaser.yaml
      # sets `pro: true`, which OSS GoReleaser refuses to validate.
      - name: Validate .goreleaser.yaml
        if: env.GORELEASER_KEY != ''
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser-pro
          version: "~> v2"
          args: check

      - name: Skip goreleaser check (missing GORELEASER_KEY)
        if: env.GORELEASER_KEY == ''
        run: echo "GORELEASER_KEY unavailable for this run; skipping goreleaser check."
