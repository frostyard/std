name: CI

# The PR gate: the Go half mirrors `make check` (fmt, lint, test) plus the
# race detector and a tidy/vet/gofmt verify job; docs-gate is the
# docs-integrity check from ADR-0001. Actions are pinned by commit SHA with
# least-privilege permissions (frostyard/core ADR-0021).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: {}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # The Makefile is the single source of truth for the pinned
      # golangci-lint release (GOLANGCI_LINT_VERSION); `make lint` warns on a
      # different local version, so lint results are reproducible between the
      # two and a linter release cannot change the gate without a commit.
      - name: Read pinned golangci-lint version
        id: lint-version
        run: |
          version="$(sed -nE 's/^GOLANGCI_LINT_VERSION[[:space:]]*:?=[[:space:]]*//p' Makefile | tr -d '\r')"
          version="${version%%[[:space:]]*}"
          test -n "$version"
          printf 'version=v%s\n' "$version" >> "$GITHUB_OUTPUT"

      # Same config `make lint` uses (.golangci.yml).
      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: ${{ steps.lint-version.outputs.version }}

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # Unit tests plus tests/e2e, which builds and runs the _examples/ programs.
      - name: Run tests
        run: go test -v ./...

  race:
    name: Race Detection
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Run tests with race detector
        run: go test -race -short ./...

  verify:
    name: Verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # std is stdlib-only: there is no go.sum, and a tidy diff (or a new
      # go.sum) here almost always means a dependency crept in.
      - name: Verify go.mod is tidy and dependency-free
        run: |
          go mod tidy
          git diff --exit-code -- go.mod
          test ! -e go.sum

      - name: Run go vet
        run: go vet ./...

      - name: Check formatting
        run: |
          gofmt -l .
          test -z "$(gofmt -l .)"

  docs-gate:
    name: Docs integrity
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check docs index, links, and conformance aliases
        run: node scripts/check-docs.mjs
