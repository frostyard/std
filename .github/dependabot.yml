version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
  # Restored now that .github/workflows/ exists (it was dropped in #16 while
  # the repo had no workflows): keeps the SHA-pinned actions current.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  # The Rust crate frostyard-problems in rust/ (ADR-0003). It has no
  # dependencies today; this entry keeps baseline row B13 true if one is
  # added later.
  - package-ecosystem: cargo
    directory: /rust
    schedule:
      interval: weekly
